services:
  app:
    build:
      context: .
      dockerfile: Dockerfile # Ou une image php:8.3-fpm / sail
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: jumpyier_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
